<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>tomypage 検査台</title></head>
<body>
<div id="rent-view">
  <div class="view active" id="view-send">
    <div id="dropzone">（明細PDFのドロップ枠のつもり）</div>
    <div id="bar">
      <label><input type="checkbox" id="rent-check-all"> 全選択</label>
      <button class="btn btn-sm" id="rent-btn-draft">下書きを作成</button>
      <button class="btn btn-sm" id="rent-btn-send">一斉送信</button>
      <span id="rent-action-status"></span>
    </div>
    <div id="rows"></div>
    <div id="rent-excluded-section">（メール送信しないオーナー のつもり）</div>
  </div>
</div>
<script>
/* ownermail.js のふりをします（読み取り口だけ） */
window.RENT = { detail: [
  { owner:'山田 太郎', atena:'山田 太郎 様', email:'yamada@example.jp', props:[] },
  { owner:'鈴木 花子', atena:'鈴木 花子 様', email:'suzuki@example.jp', props:[] },
  { owner:'私（テスト）', atena:'私 様',      email:'me@example.jp',     props:[] },
  { owner:'アドレス無し', atena:'',           email:'',                  props:[] },
  /* ★「メール送信しないオーナー（別管理）」の方。
       ownermail.js は detail には入れたまま、一覧には出しません
       （チェックの箱もありません）。メールアドレスは持っています。 */
  { owner:'森本 将行',   atena:'森本 将行 様', email:'morimoto@example.jp', props:[] }
],
  /* ★本物（ownermail.js）と同じ async にします。
       約束を返すので、呼ぶ側が待たなければ中身が取れません。 */
  makeOwnerPdfBase64: async function(){ return null; } };
/* まっとうな base64（100字以上） */
window.__B64 = 'JVBERi0xLjQK' + 'QUJDREVGR0hJSktMTU5PUFFSU1RVVldYWVowMTIzNDU2Nzg5'.repeat(4);
window.__EXCLUDED = 4;    /* 別管理の方の番号 */
/* 振り分け一覧のチェック箱（本物と同じ class / value） */
document.getElementById('rows').innerHTML = window.RENT.detail
  .map(function(d,i){
    /* ★別管理の方は、一覧に出しません（本物と同じ作りです） */
    if(i === window.__EXCLUDED) return '';
    return '<label><input type="checkbox" class="rent-check" value="'+i+'"'+
           (d.email?'':' disabled')+'> '+d.owner+'</label><br>';
  }).join('');
document.getElementById('rent-excluded-section').innerHTML =
  'メール送信しないオーナー（別管理）： 森本 将行（morimoto@example.jp）';
/* 接続設定は、はじめから入っている形にします */
localStorage.setItem('pv_mypage_url','https://script.google.com/macros/s/TEST/exec');
localStorage.setItem('pv_mypage_key','K'.repeat(40));
/* 通信のふり */
window.__sent = [];
window.__reg  = ['yamada@example.jp'];     /* 台帳に載っている＝招待済み */
window.fetch = function(url, o){
  var b = JSON.parse(o.body);
  window.__sent.push(b);
  var r = { ok:true };
  if(b.action === 'stCheck'){
    r.list = window.__reg.map(function(m){
      return { mail:m, name:'—', area:'', months:2, ym:'2026年9月',
               pdf:true, opened:false, login:'2026/9/20', seen:'' };
    });
  }else if(b.action === 'push'){
    var one = (b.owners||[])[0] || {};
    var mail = String(one.email||'').toLowerCase();
    var neu = window.__reg.indexOf(mail) < 0;
    if(neu) window.__reg.push(mail);
    r.made = neu ? 1 : 0; r.added = one.fileId ? 1 : 0; r.mailNg = 0;
    /* ★「明細が入りました」のお知らせ。
         はじめての方には出さず、すでに登録済みの方にだけ出します。
         window.__notengai = true で「出せなかった」を作れます。 */
    if(!window.__noteoff){
      if(neu || !one.fileId){ r.noted = 0; r.noteNg = 0; }
      else if(window.__notengai){ r.noted = 0; r.noteNg = 1; }
      else { r.noted = 1; r.noteNg = 0; }
    }
  }else if(b.action === 'putPdf'){
    /* ★入れられなかったときは、理由を message で返します（本物と同じ形） */
    if(window.__pdfng) r = { ok:false, error:'ng',
      message:'ドライブへ入れられませんでした。DRIVE_ID をご確認ください。' };
    else r.id = 'FID';
  }
  return Promise.resolve({ text: function(){ return Promise.resolve(JSON.stringify(r)); } });
};
</script>
<script src="../js/tomypage.js"></script>
</body></html>
