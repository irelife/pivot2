<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIVOT 照合（スプレッドシート ⇔ Firestore）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#f5f5f6;color:#17171a;padding:24px}
.w{max-width:900px;margin:0 auto;background:#fff;border-radius:14px;padding:26px 28px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
h1{font-size:22px;margin-bottom:6px}
.sub{font-size:14px;color:#6b6b73;margin-bottom:18px}
.box{border:2px solid #17171a;border-radius:10px;padding:14px 16px;margin:14px 0;font-size:15px;line-height:1.7}
.ok{border-color:#15803d;background:#f0fdf4}
.ng{border-color:#b91c1c;background:#fef2f2}
button{font:inherit;font-weight:800;padding:14px 22px;border-radius:10px;border:2px solid #17171a;
       background:#17171a;color:#fff;cursor:pointer;margin-right:10px}
button:disabled{opacity:.4;cursor:not-allowed}
button.sec{background:#fff;color:#17171a}
#log{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.6;
     background:#fafafa;border:1px solid #ddd;border-radius:8px;padding:12px;margin-top:16px;max-height:520px;overflow:auto}
</style>
</head>
<body>
<div class="w">
  <h1>PIVOT 照合</h1>
  <div class="sub" id="inst">インスタンスを判定中…</div>

  <div class="box">
    <b>スプレッドシート（いまの正）</b> と <b>Firestore（控え）</b> を全件つき合わせます。<br>
    <b>どちらにも一切書き込みません。</b> 読んで比べるだけです。
  </div>

  <div id="who" class="box" style="display:none"></div>

  <p>
    <button id="btn-login" class="sec">① ログイン</button>
    <button id="btn-run" disabled>② 照合する</button>
  </p>

  <div id="log">「① ログイン」から始めてください。</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
function insPrefix(){
  try{
    var seg = (location.pathname || '').split('/').filter(function(s){ return s; });
    var name = seg.length ? seg[seg.length - 1] : '';
    if(/\.html?$/i.test(name)) name = seg.length > 1 ? seg[seg.length - 2] : '';
    return name ? (name + '_') : 'pivot_';
  }catch(e){ return 'pivot_'; }
}
var INS = insPrefix().replace(/_+$/, '') || 'pivot';
document.getElementById('inst').textContent =
  'インスタンス： ' + INS + '　（' + (INS === 'pivot2' ? '広島・福山' : INS === 'pivot3' ? '岡山' : '不明') + '）';

var logEl = document.getElementById('log');
function log(s){ logEl.textContent += '\n' + (s === undefined ? '' : s); logEl.scrollTop = logEl.scrollHeight; }
function clr(){ logEl.textContent = ''; }

function gasUrl(){ return (localStorage.getItem(INS + '_cloud_url') || '').trim(); }

async function postToGas(url, body){
  var res = await fetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                               body: JSON.stringify(body), redirect:'follow' });
  var t = await res.text();
  try{ return JSON.parse(t); }catch(e){ throw new Error('GASの応答が不正: ' + t.slice(0,200)); }
}

function spotsToMap(spots){
  var m = {};
  (spots || []).forEach(function(s){
    var k = String(s && s.no != null ? s.no : '');
    if(!k || m[k]) return;
    var o = { no:s.no, type:s.type||'並', tou:s.tou||'', room:(s.room==null?'':s.room),
              user:s.user||'', price:s.price||0, status:s.status||'空', note:s.note||'' };
    ['end_date','res_date','res_tou','res_room','res_user','res_price','res_note'].forEach(function(f){
      if(s[f]!=null && s[f]!=='') o[f]=s[f];
    });
    m[k]=o;
  });
  return m;
}
function docOf(b){
  var d = { id:b.id||'', name:b.name||'', addr:b.addr||'', spots:spotsToMap(b.spots) };
  if(b.layout_id)  d.layout_id  = b.layout_id;
  if(b.layout2_id) d.layout2_id = b.layout2_id;
  if(b.photo_ids)  d.photo_ids  = b.photo_ids;
  if(b.mime)       d.mime       = b.mime;
  return d;
}
function norm(v){ return v == null ? '' : String(v); }

document.getElementById('btn-login').onclick = async function(){
  try{
    clr(); log('ログインを確認します…');
    var u = firebase.auth().currentUser;
    if(!u){
      var em = prompt('メールアドレス'); if(!em) return;
      var pw = prompt('パスワード');     if(!pw) return;
      await firebase.auth().signInWithEmailAndPassword(em, pw);
      u = firebase.auth().currentUser;
    }
    document.getElementById('who').style.display = '';
    document.getElementById('who').innerHTML = 'ログイン中： <b>' + u.email + '</b>';
    log('ログインできました： ' + u.email);
    document.getElementById('btn-run').disabled = false;
  }catch(e){ log('❌ ' + e.message); }
};

document.getElementById('btn-run').onclick = async function(){
  this.disabled = true;
  try{
    clr(); log('【照合】どちらにも書き込みません。');
    var u = gasUrl();
    if(!u) throw new Error('この端末に GAS の URL がありません。先に PIVOT を開いてログインしてください。');

    log('スプレッドシートを読み込み中…');
    var r = await postToGas(u, { action:'load' });
    if(!r || !r.ok || !r.payload) throw new Error('スプレッドシートから読めませんでした');
    var sheet = r.payload.buildings || {};

    log('Firestore を読み込み中…');
    var snap = await firebase.firestore().collection(INS).doc('data').collection('buildings').get();
    var fs = {};
    snap.forEach(function(d){ fs[d.id] = d.data(); });

    var sIds = Object.keys(sheet), fIds = Object.keys(fs);
    log('');
    log('  スプレッドシート ： 物件 ' + sIds.length + ' 件');
    log('  Firestore　　　　： 物件 ' + fIds.length + ' 件');
    log('');

    var diff = [], sSpot = 0, fSpot = 0;

    sIds.forEach(function(id){
      var want = docOf(sheet[id]);
      sSpot += Object.keys(want.spots).length;
      var got = fs[id];
      if(!got){ diff.push('【Firestoreに無い物件】' + (want.name || id)); return; }

      ['name','addr','layout_id','layout2_id'].forEach(function(k){
        if(norm(want[k]) !== norm(got[k])){
          diff.push('【' + k + 'が違う】' + (want.name || id) +
                    '　シート「' + norm(want[k]) + '」 / Firestore「' + norm(got[k]) + '」');
        }
      });

      var ws = want.spots, gs = got.spots || {};
      Object.keys(ws).forEach(function(no){
        if(!gs[no]){ diff.push('【Firestoreに無い区画】' + (want.name||id) + '　P' + no); return; }
        ['type','tou','room','user','price','status','note'].forEach(function(f){
          if(norm(ws[no][f]) !== norm(gs[no][f])){
            diff.push('【区画の' + f + 'が違う】' + (want.name||id) + '　P' + no +
                      '　シート「' + norm(ws[no][f]) + '」 / Firestore「' + norm(gs[no][f]) + '」');
          }
        });
      });
      Object.keys(gs).forEach(function(no){
        if(!ws[no]) diff.push('【シートに無い区画（Firestoreに余分）】' + (want.name||id) + '　P' + no);
      });
    });

    fIds.forEach(function(id){
      fSpot += Object.keys((fs[id] && fs[id].spots) || {}).length;
      if(!sheet[id]) diff.push('【シートに無い物件（Firestoreに余分）】' + ((fs[id]&&fs[id].name)||id));
    });

    log('  区画　スプレッドシート ' + sSpot + ' ／ Firestore ' + fSpot);
    log('');
    if(!diff.length){
      log('✅ 差はありません。完全に一致しています。');
      document.getElementById('log').className = '';
    }else{
      log('⚠️ ' + diff.length + ' 件の違いが見つかりました：');
      log('');
      diff.slice(0, 200).forEach(function(x){ log('  ' + x); });
      if(diff.length > 200) log('  … ほか ' + (diff.length - 200) + ' 件');
      log('');
      log('※ 直前に保存した内容がまだ控えられていないだけの場合もあります。');
      log('　 PIVOT を開いて数秒待ってから、もう一度照合してみてください。');
    }
  }catch(e){ log('❌ ' + e.message); }
  this.disabled = false;
};
</script>
</body>
</html>
